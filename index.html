<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Typing Trainer</h1>

    <div class="stats" aria-live="polite">
      <!-- Only the numbers are bold; a unit is hidden while its value is "–". -->
      <span>WPM: <strong id="wpm">–</strong></span>
      <span title="Final: mistakes you fixed with Backspace don't count">
        Accuracy: <strong id="accuracy">–</strong><span class="unit">%</span>
        (final <strong id="final-accuracy">–</strong><span class="unit">%</span>)
      </span>
      <span>Time: <strong id="time">–</strong><span class="unit">s</span></span>
    </div>

    <div class="text-wrap">
      <div id="text" class="text" tabindex="0" aria-label="Text to type. Start typing to begin."></div>
      <!-- Shown on top of the blurred text whenever the text box is not focused. -->
      <div class="overlay" aria-hidden="true">Click here to start typing.<br>Backspace fixes mistakes.</div>
    </div>

    <div class="controls">
      <button id="restart" type="button">Restart <kbd>Esc</kbd></button>
      <button id="next" type="button" title="Enter works before you start typing or after finishing a text">New text <kbd>Enter</kbd></button>
    </div>
  </main>

  <!-- Classic scripts (not modules) so the page also works when opened directly from disk. -->
  <script src="js/texts.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
